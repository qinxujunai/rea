name: Set up REA fork and create backup

on:
  push:
    paths:
      - .github/workflows/rea-fork-maintenance.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: rea-fork-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.repository == 'qinxujunai/rea'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Disable unnecessary upstream workflows in this fork
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci.yml ci-timings.yml mutation.yml release.yml; do
            echo "Disabling ${workflow} in ${GITHUB_REPOSITORY}"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/disable"
          done
          echo "Disabled upstream CI, CI timings, mutation tests, and Release."
          for workflow in ci.yml ci-timings.yml mutation.yml release.yml; do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')
            test "$state" = "disabled_manually"
          done

      - name: Cancel previous CI and Release runs if still running
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for status in in_progress queued; do
            run_ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?status=${status}&per_page=100" --jq '.workflow_runs[] | select(.name == "CI" or .name == "Release") | .id')
            for run_id in ${run_ids}; do
              echo "Canceling redundant workflow run ${run_id}"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
            done
          done

      - name: Check out fork including history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create downloadable source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=rea-source-backup.zip HEAD
          test -s rea-source-backup.zip
          git bundle create rea-git-history.bundle --all
          git bundle verify rea-git-history.bundle
          test -s rea-git-history.bundle

      - name: Upload backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rea-source-backup
          path: |
            rea-source-backup.zip
            rea-git-history.bundle
          if-no-files-found: error
          retention-days: 90
